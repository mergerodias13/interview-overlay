name: Build Interview Overlay (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore InterviewOverlay/InterviewOverlay.csproj

      - name: Publish self-contained single-file .exe
        run: dotnet publish InterviewOverlay/InterviewOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_output

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterviewOverlay-exe
          path: publish_output/InterviewOverlay.exe
          if-no-files-found: error